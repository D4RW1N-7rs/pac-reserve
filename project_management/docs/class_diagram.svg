<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 830" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="diamond" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <polygon points="6,0 12,6 6,12 0,6" fill="#f0883e" stroke="#f0883e" />
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <style>
    .title { fill: #f0f6fc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #8b949e; font-size: 13px; }
    .class-header { fill: #f0f6fc; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .class-sub { fill: #58a6ff; font-size: 10px; font-style: italic; text-anchor: middle; }
    .prop-text { fill: #c9d1d9; font-size: 11px; font-family: 'SFMono-Regular', Consolas, monospace; }
    .method-text { fill: #7ee787; font-size: 11px; font-family: 'SFMono-Regular', Consolas, monospace; }
    .divider { stroke: #30363d; stroke-width: 1.2; }
    .rel-line { stroke: #58a6ff; stroke-width: 1.5; fill: none; }
    .comp-line { stroke: #f0883e; stroke-width: 1.5; fill: none; }
    .label { fill: #8b949e; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Title -->
  <text x="575" y="38" class="title" text-anchor="middle">Class Diagram: Exact Codebase Architecture</text>
  <text x="575" y="58" class="subtitle" text-anchor="middle">Mapped 1:1 to PacmanGame, Player, Ghost, Collectible &amp; Modules</text>

  <!-- ==================== PACMAN_GAME CLASS ==================== -->
  <g transform="translate(380, 95)" filter="url(#shadow)">
    <rect width="370" height="310" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <path d="M 0,0 H 370 V 38 H 0 Z" fill="url(#headerGrad)" />
    <text x="185" y="24" class="class-header">PacmanGame</text>
    <line x1="0" y1="38" x2="370" y2="38" class="divider"/>
    <!-- Attributes -->
    <text x="14" y="55" class="prop-text">+ current_state: GameState = GameState.MENU</text>
    <text x="14" y="71" class="prop-text">+ pacman: Player</text>
    <text x="14" y="87" class="prop-text">+ ghosts: list[Ghost]</text>
    <text x="14" y="103" class="prop-text">+ gums: list[Collectible], super_gums: list[..]</text>
    <text x="14" y="119" class="prop-text">+ score: int, lives: int, current_level: int</text>
    <text x="14" y="135" class="prop-text">+ timer: int, level_time_remaining: int</text>
    <text x="14" y="151" class="prop-text">+ maze: list[list[int]]</text>
    <text x="14" y="167" class="prop-text">+ player_name: str, invincible: bool, ghosts_frozen: bool</text>
    <line x1="0" y1="177" x2="370" y2="177" class="divider"/>
    <!-- Methods -->
    <text x="14" y="195" class="method-text">+ start_level(level_index: int): void</text>
    <text x="14" y="211" class="method-text">+ handle_events(events: list[Event]): void</text>
    <text x="14" y="227" class="method-text">+ handle_mouse_click(pos: tuple[int, int]): void</text>
    <text x="14" y="243" class="method-text">+ handle_key_down(event: Event): void</text>
    <text x="14" y="259" class="method-text">+ apply_cheat(key: int): void</text>
    <text x="14" y="275" class="method-text">+ update(): void</text>
    <text x="14" y="291" class="method-text">+ respawn_after_death(): void</text>
    <text x="14" y="305" class="method-text">+ save_player_score(): void, draw(): void</text>
  </g>

  <!-- ==================== ENUM: GameState ==================== -->
  <g transform="translate(60, 95)" filter="url(#shadow)">
    <rect width="230" height="200" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
    <path d="M 0,0 H 230 V 38 H 0 Z" fill="#21262d" />
    <text x="115" y="19" class="class-sub">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="115" y="32" class="class-header">GameState</text>
    <line x1="0" y1="38" x2="230" y2="38" class="divider"/>
    <text x="14" y="58" class="prop-text">MENU = auto()</text>
    <text x="14" y="78" class="prop-text">PLAYING = auto()</text>
    <text x="14" y="98" class="prop-text">HIGH_SCORES = auto()</text>
    <text x="14" y="118" class="prop-text">HELP = auto()</text>
    <text x="14" y="138" class="prop-text">PAUSED = auto()</text>
    <text x="14" y="158" class="prop-text">GAME_OVER = auto()</text>
    <text x="14" y="178" class="prop-text">WINNER = auto()</text>
  </g>

  <!-- ==================== PLAYER CLASS ==================== -->
  <g transform="translate(60, 480)" filter="url(#shadow)">
    <rect width="300" height="280" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <path d="M 0,0 H 300 V 38 H 0 Z" fill="url(#headerGrad)" />
    <text x="150" y="24" class="class-header">Player (entities/player.py)</text>
    <line x1="0" y1="38" x2="300" y2="38" class="divider"/>
    <!-- Attributes -->
    <text x="14" y="56" class="prop-text">+ pixel_x: int, pixel_y: int</text>
    <text x="14" y="73" class="prop-text">+ current_direction: str = "STOP"</text>
    <text x="14" y="90" class="prop-text">+ next_direction: str = "STOP"</text>
    <text x="14" y="107" class="prop-text">+ last_direction: str = "RIGHT"</text>
    <text x="14" y="124" class="prop-text">+ speed: int = 5</text>
    <text x="14" y="141" class="prop-text">+ animation_tick: int = 0</text>
    <line x1="0" y1="151" x2="300" y2="151" class="divider"/>
    <!-- Methods -->
    <text x="14" y="171" class="method-text">+ load_images(): void</text>
    <text x="14" y="188" class="method-text">+ handle_input(event: Event): void</text>
    <text x="14" y="205" class="method-text">+ update(maze, tile_size: int): void</text>
    <text x="14" y="222" class="method-text">+ draw(window, pad, hud_h, tile): void</text>
    <text x="14" y="239" class="method-text">+ get_current_image(): Surface</text>
  </g>

  <!-- ==================== GHOST CLASS ==================== -->
  <g transform="translate(420, 480)" filter="url(#shadow)">
    <rect width="320" height="280" rx="8" fill="#161b22" stroke="#f87171" stroke-width="2"/>
    <path d="M 0,0 H 320 V 38 H 0 Z" fill="url(#headerGrad)" />
    <text x="160" y="24" class="class-header">Ghost (entities/ghost.py)</text>
    <line x1="0" y1="38" x2="320" y2="38" class="divider"/>
    <!-- Attributes -->
    <text x="14" y="56" class="prop-text">+ pixel_x: int, pixel_y: int</text>
    <text x="14" y="73" class="prop-text">+ start_x: int, start_y: int</text>
    <text x="14" y="90" class="prop-text">+ color: str ("red", "cyan", "orange", "pink")</text>
    <text x="14" y="107" class="prop-text">+ state: str ("CHASE", "FRIGHTENED", "EATEN")</text>
    <text x="14" y="124" class="prop-text">+ frightened_timer: float</text>
    <text x="14" y="141" class="prop-text">+ speed: int = 4, direction: str = "LEFT"</text>
    <line x1="0" y1="151" x2="320" y2="151" class="divider"/>
    <!-- Methods -->
    <text x="14" y="171" class="method-text">+ frighten(): void</text>
    <text x="14" y="188" class="method-text">+ reset(tile_size: int): void</text>
    <text x="14" y="205" class="method-text">+ bfs(maze, start, target): str | None</text>
    <text x="14" y="222" class="method-text">+ update(maze, tile, pacman): void</text>
    <text x="14" y="239" class="method-text">+ collide(pacman: Any): bool</text>
    <text x="14" y="256" class="method-text">+ draw(window, pad, hud_h, tile): void</text>
  </g>

  <!-- ==================== COLLECTIBLE CLASS ==================== -->
  <g transform="translate(800, 480)" filter="url(#shadow)">
    <rect width="310" height="230" rx="8" fill="#161b22" stroke="#34d399" stroke-width="2"/>
    <path d="M 0,0 H 310 V 38 H 0 Z" fill="url(#headerGrad)" />
    <text x="155" y="24" class="class-header">Collectible (entities/collectible.py)</text>
    <line x1="0" y1="38" x2="310" y2="38" class="divider"/>
    <!-- Attributes -->
    <text x="14" y="56" class="prop-text">+ x: int, y: int</text>
    <text x="14" y="73" class="prop-text">+ type: CollectibleType (PACGUM/SUPER)</text>
    <text x="14" y="90" class="prop-text">+ points: int</text>
    <text x="14" y="107" class="prop-text">+ visible: bool = True</text>
    <line x1="0" y1="117" x2="310" y2="117" class="divider"/>
    <!-- Methods -->
    <text x="14" y="137" class="method-text">+ generate_gums(maze, w, h, pct, ..): tuple</text>
    <text x="14" y="154" class="method-text">+ valid_gum_cells(maze): list[tuple]</text>
    <text x="14" y="171" class="method-text">+ draw(surface, pad, hud_h, tile): void</text>
  </g>

  <!-- ==================== MODULE HELPERS / SYSTEMS ==================== -->
  <g transform="translate(820, 95)" filter="url(#shadow)">
    <rect width="290" height="230" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <path d="M 0,0 H 290 V 38 H 0 Z" fill="#21262d" />
    <text x="145" y="19" class="class-sub">&lt;&lt;systems &amp; engine modules&gt;&gt;</text>
    <text x="145" y="32" class="class-header">Modules / Standalone Functions</text>
    <line x1="0" y1="38" x2="290" y2="38" class="divider"/>
    <text x="14" y="58" class="method-text">eat_collectibles(pacman, gums, ..): tuple</text>
    <text x="14" y="76" class="method-text">find_middle_spawn(maze): tuple[int, int]</text>
    <text x="14" y="94" class="method-text">highscore.load_scores(file): list</text>
    <text x="14" y="112" class="method-text">highscore.save_highscore(file, name, pts)</text>
    <text x="14" y="130" class="method-text">maze_integration.create_maze(w, h, seed)</text>
    <text x="14" y="148" class="method-text">config_loader.load_config(file): dict</text>
    <text x="14" y="166" class="method-text">menus.load_assets(): dict</text>
    <text x="14" y="184" class="method-text">hud.draw_hud(window, score, lives, ..)</text>
  </g>

  <!-- ==================== ASSOCIATIONS ==================== -->
  <!-- Game to GameState -->
  <line x1="380" y1="180" x2="290" y2="180" class="rel-line" />
  <text x="320" y="172" class="label">current_state</text>

  <!-- Game to Modules -->
  <line x1="750" y1="180" x2="820" y2="180" class="rel-line" marker-end="url(#arrow)" />

  <!-- Composition: PacmanGame -> Player -->
  <path d="M 430,405 L 430,440 L 210,440 L 210,480" class="comp-line" marker-start="url(#diamond)" />
  <text x="440" y="430" class="label">1</text>
  <text x="220" y="470" class="label">1</text>

  <!-- Composition: PacmanGame -> Ghost -->
  <path d="M 565,405 L 565,480" class="comp-line" marker-start="url(#diamond)" />
  <text x="575" y="430" class="label">1</text>
  <text x="575" y="470" class="label">4 (red, cyan, orange, pink)</text>

  <!-- Composition: PacmanGame -> Collectible -->
  <path d="M 700,405 L 700,440 L 950,440 L 950,480" class="comp-line" marker-start="url(#diamond)" />
  <text x="710" y="430" class="label">1</text>
  <text x="960" y="470" class="label">0..* (gums, super_gums)</text>

</svg>
